name = "kendall-county-water-table"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The Worker serves the static page (public/) and also exposes /api/well,
# which proxies + aggregates the TWDB feed server-side (the upstream feed
# has no CORS header and is ~8.5MB, so we downsample before it hits the browser).
[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker before serving static assets so injectCommon() can rewrite every
# HTML page (inject /tww-common.js) — otherwise Cloudflare serves static files
# directly and the Worker never sees them.
run_worker_first = true

# Durable archive of the downsampled well payloads (the full historic series).
# The Worker reads well data from here instead of re-fetching the ~33MB TWDB
# feed on every cache miss; TWDB is pulled at most once per well per day, in the
# background, to refresh this bucket.
[[r2_buckets]]
binding = "WATER_DATA"
bucket_name = "texaswaterwatchers-data"
